   Ten plik to tylko „szkielet”: nagłówek z menu i puste miejsce na treść.
   Treść każdej podstrony rysuje JavaScript (folder js/), wygląd — CSS (folder css/).

   Kolejność plików poniżej MA ZNACZENIE:
   • css/14-wyglad.css musi być ostatni (nadpisuje wcześniejsze style),
   • js/00-ustawienia.js i js/01-dane.js pierwsze, js/15-subskrypcje.js, js/16-pieniadze.js, js/17-finanse.js, js/18-cv.js i js/19-skrzynka.js przed routerem, js/13-router.js uruchamia stronę, js/14-szkice-formularzy.js na samym końcu.

   Menu: dopisujesz/usuwasz pozycje w <nav> niżej. Każdy link ma
   href="#klucz" i data-r="klucz" — ten sam klucz musi być w ROUTES (js/13-router.js).
  ════════════════════════════════════════════════════════════════════════
-->
